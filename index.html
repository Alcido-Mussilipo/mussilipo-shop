    .cta {

      -webkit-tap-highlight-color: transparent;
      transition: transform .2s ease;
    }
    .cta::before {
      content: "";
      position: absolute;
      z-index: -1;
      top: -60%;
      left: -45%;
      width: 35%;
      height: 220%;
      transform: rotate(25deg);
      background: rgba(255,255,255,.42);
      filter: blur(7px);

    }
    .cta:active { transform: scale(.97); }
    .small {

      color: #647568;
      font-size: 13px;
    }
    @keyframes luminousColors {
      0%, 100% { background-color: #079447; }
      25% { background-color: #00a88f; }
      50% { background-color: #74b900; }
      75% { background-color: #00a6c7; }
    }
    @keyframes luminousGlow {
      0%, 100% {
        box-shadow: 0 0 10px rgba(34,197,94,.65), 0 8px 22px rgba(22,139,69,.25);
      }
      50% {
        box-shadow: 0 0 25px rgba(0,220,170,.95), 0 0 38px rgba(34,197,94,.55);
      }
    }
    @keyframes shineSweep {
      0% { left: -45%; opacity: 0; }
      20% { opacity: .9; }
      65%, 100% { left: 125%; opacity: 0; }
    }
